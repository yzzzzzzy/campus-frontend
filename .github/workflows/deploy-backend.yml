name: Deploy Fullstack to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==============================
      # 1. CI 阶段：在 GitHub 官方服务器上打包前端
      # ==============================
      - name: Build Frontend
        run: |
          cd campus-frontend
          npm install
          npm run build

      # ==============================
      # 2. CD 阶段：压缩后端代码（不依赖 git pull）
      # ==============================
      - name: Package Backend Code
        run: |
          # 把后端代码打包，排除掉前端源码、依赖包和 git 记录，体积极小
          tar -czvf backend.tar.gz --exclude='campus-frontend' --exclude='.git' --exclude='node_modules' --exclude='backend.tar.gz' .

      # ==============================
      # 3. CD 阶段：使用 SCP 将文件投递到腾讯云服务器
      # ==============================
      - name: Transfer Frontend Dist
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "campus-frontend/dist/*"
          target: "/var/www/campus-frontend/"
          strip_components: 2

      - name: Transfer Backend Archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/var/www/campus-backend/"

      # ==============================
      # 4. CD 阶段：SSH 登录服务器执行解压与重启
      # ==============================
      - name: Extract and Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/campus-backend
            
            # 1. 解压收到的后端代码包，直接覆盖旧文件
            tar -xzvf backend.tar.gz
            rm backend.tar.gz
            
            # 2. 安装后端依赖 (使用国内镜像加速)
            npm install --registry=https://registry.npmmirror.com
            
            # 3. 重启后端服务
            pm2 restart campus-api
            
            echo "🚀 全栈 CI/CD 自动化部署大功告成！前端和后端均已更新至最新版本！"