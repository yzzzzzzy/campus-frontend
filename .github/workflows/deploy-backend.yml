name: Deploy Fullstack to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 在 GitHub 官方服务器上拉取最新代码
      - name: Checkout Code
        uses: actions/checkout@v3
        
      # 2. 建议显式指定 Node.js 版本，保证打包环境稳定
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 如果你的项目需要更高版本可以改成 20

      # 3. 在官方服务器上安装前端依赖并打包
      - name: Build Frontend
        run: |
          cd campus-frontend
          npm install
          npm run build

      # 4. 把打包好的 dist 目录通过 SCP 传到腾讯云的前端静态目录
      - name: Deploy Frontend via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "campus-frontend/dist/*"
          target: "/var/www/campus-frontend/"
          strip_components: 2 # 剥离 campus-frontend/dist 这两层目录

      # 5. 通过 SSH 登录服务器，更新后端代码并重启 PM2 服务
      - name: Update Backend & Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            # 进入后端项目目录（假设你的后端代码克隆在这里）
            cd /var/www/campus-backend
            
            # 使用国内镜像加速代理，解决后端服务器 git pull 超时 443 的问题
            git remote set-url origin https://mirror.ghproxy.com/https://github.com/yzzzzzzy/campus-frontend.git
            
            # 拉取最新代码并安装后端依赖
            git pull
            npm install
            
            # 重启后端守护进程
            pm2 restart campus-api