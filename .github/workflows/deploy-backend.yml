name: Deploy Fullstack to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==============================
      # 1. CI 阶段：在 GitHub 官方服务器上打包前端
      # ==============================
      - name: Build Frontend
        run: |
          cd campus-frontend
          npm install
          npm run build

      # ==============================
      # 2. CD 阶段：压缩后端代码（使用隔离目录防报错）
      # ==============================
      - name: Package Backend Code
        run: |
          # 创建一个专用的临时文件夹
          mkdir -p deploy_tmp
          # 把压缩包生成在临时文件夹里，同时把这个临时文件夹本身排除掉
          tar -czvf deploy_tmp/backend.tar.gz --exclude='campus-frontend' --exclude='.git' --exclude='node_modules' --exclude='deploy_tmp' .

      # ==============================
      # 3. CD 阶段：使用 SCP 将文件投递到腾讯云服务器
      # ==============================
      - name: Transfer Frontend Dist
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "campus-frontend/dist/*"
          target: "/var/www/campus-frontend/"
          strip_components: 2

      - name: Transfer Backend Archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy_tmp/backend.tar.gz"   # 注意：这里的路径加上了 deploy_tmp/
          target: "/var/www/campus-backend/"
          strip_components: 1                   # 关键魔法：剥离掉 deploy_tmp 这个文件夹外壳，让压缩包直接躺在后端的根目录下

      # ==============================
      # 4. CD 阶段：SSH 登录服务器执行解压与重启 (这一步的代码完全不需要动！)
      # ==============================
      - name: Extract and Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/campus-backend
            
            # 1. 解压收到的后端代码包，直接覆盖旧文件
            tar -xzvf backend.tar.gz
            rm backend.tar.gz
            
            # 2. 安装后端依赖 (使用国内镜像加速)
            npm install --registry=https://registry.npmmirror.com
            
            # 3. 重启后端服务
            pm2 restart campus-api

            # 4. 清理旧版前端文件（避免磁盘堆积）
            cd /var/www/campus-frontend && find ./assets -type f -mtime +7 -delete 2>/dev/null || true
            
            echo "🚀 全栈 CI/CD 自动化部署大功告成！前端和后端均已更新至最新版本！"